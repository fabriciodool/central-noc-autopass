<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Operações NOC - Autopass</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="container">
            <header class="header">
                <div>
                    <h1 class="brand-title">Central de Comunicação NOC</h1>
                    <p class="brand-subtitle">Autopass • Acionamento, Alertas e Diário de Bordo</p>
                </div>

                <label class="theme-switch" for="themeToggle" title="Alternar tema">
                    <span class="theme-switch-text">Dark mode</span>
                    <input type="checkbox" id="themeToggle" aria-label="Alternar dark mode">
                    <span class="theme-slider"></span>
                </label>
            </header>

            <nav class="tabs-container" aria-label="Módulos">
                <button class="tab-btn active" id="btnTabCarimbo" type="button" data-tab-target="carimbo">
                    Gerador de Carimbo
                </button>
                <button class="tab-btn" id="btnTabDiario" type="button" data-tab-target="diario">
                    Diário de Bordo
                </button>
            </nav>

            <section id="tab-carimbo" class="tab-content active" aria-label="Gerador de Carimbo">
                <div class="form-group">
                    <label for="txtChamado">Chamado:</label>
                    <input type="text" id="txtChamado" placeholder="Ex: INC123456">
                </div>

                <div class="form-group">
                    <label for="txtProblema">Problema:</label>
                    <input type="text" id="txtProblema" placeholder="Ex: Instabilidade no sistema de pagamentos nos ATMs">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="txtInicio">Início:</label>
                        <input type="text" id="txtInicio">
                    </div>
                    <div class="form-group">
                        <label for="txtFim">Fim:</label>
                        <input type="text" id="txtFim" value="Em aberto">
                    </div>
                </div>

                <div class="form-group">
                    <label for="txtImpacto">Impacto / Sintoma:</label>
                    <input type="text" id="txtImpacto" placeholder="Ex: Rede de vendas fora do ar, clientes sem acesso ao app">
                </div>

                <div class="form-group">
                    <label for="txtCausa">Causa:</label>
                    <input type="text" id="txtCausa" value="Em análise">
                </div>

                <div class="form-group">
                    <label for="cmbStatus">Status:</label>
                    <select id="cmbStatus">
                        <option value="Em atendimento" selected>Em atendimento</option>
                        <option value="Aguardando Fornecedor">Aguardando Fornecedor</option>
                        <option value="Contornado">Contornado</option>
                        <option value="Resolvido">Resolvido</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="txtAtualizacao">Atualização / Tratativa:</label>
                    <textarea id="txtAtualizacao" placeholder="Ex: Tratativa com time interno realizando troubleshooting..."></textarea>
                </div>
            </section>

            <section id="tab-diario" class="tab-content" aria-label="Diário de Bordo">
                <div class="form-group">
                    <label for="txtDiarioDataHora">Data e Hora:</label>
                    <input type="text" id="txtDiarioDataHora">
                </div>

                <div class="form-group">
                    <label for="txtDiarioTema">Tema e Problema:</label>
                    <input type="text" id="txtDiarioTema" placeholder="Ex: Indisponibilidade BOT WhatsApp - Chamado I2605-74303">
                </div>

                <div class="form-group">
                    <label for="txtDiarioParticipantes">Participantes:</label>
                    <textarea id="txtDiarioParticipantes" placeholder="Ex: Fabricio Dias, Everton Da Silva, Diane Dodato..."></textarea>
                </div>

                <div class="form-group">
                    <label for="txtDiarioCoordenacao">Coordenação da Reunião:</label>
                    <input type="text" id="txtDiarioCoordenacao" value="Command Center">
                </div>

                <div class="form-group">
                    <label for="txtDiarioResumo">Resumo Inicial:</label>
                    <textarea class="textarea-lg" id="txtDiarioResumo" placeholder="Descreva o contexto inicial, impacto, times envolvidos e motivo da reunião..."></textarea>
                </div>

                <div class="form-group">
                    <label for="txtDiarioStatusFinal">Status Final:</label>
                    <textarea id="txtDiarioStatusFinal" placeholder="Ex: Ambiente normalizado e serviço restabelecido."></textarea>
                </div>

                <div class="form-group">
                    <label for="txtDiarioAcoes">Ações Realizadas:</label>
                    <textarea class="textarea-lg" id="txtDiarioAcoes" placeholder="Uma ação por linha. Ex: 20:30 - Identificada indisponibilidade no BOT WhatsApp."></textarea>
                    <p class="hint">Digite uma ação por linha. O Word será gerado com lista em tópicos.</p>
                </div>

                <div class="form-group">
                    <label for="txtDiarioPendencias">Pendências / Próximos Passos:</label>
                    <textarea class="textarea-lg" id="txtDiarioPendencias" placeholder="Uma pendência por linha. Ex: Aguardar RCA oficial do fornecedor."></textarea>
                    <p class="hint">Digite uma pendência por linha. O Word será gerado com lista em tópicos.</p>
                </div>
            </section>

            <section class="output-container" id="outputContainer" aria-live="polite">
                <p class="success-label" id="lblSucesso">Texto gerado!</p>
                <pre id="txtResultado"></pre>
            </section>

            <footer class="actions-container" id="carimboButtons">
                <button class="btn btn-submit" type="button" data-action="carimbo-copiar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Gerar e Copiar
                </button>

                <button class="btn btn-whatsapp" type="button" data-action="carimbo-whatsapp">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.004 2c-5.518 0-9.996 4.477-9.996 9.996 0 1.764.459 3.483 1.33 5.016l-1.417 5.176 5.305-1.392c1.478.807 3.142 1.232 4.778 1.232 5.518 0 9.996-4.477 9.996-9.996 0-5.518-4.477-9.996-9.996-9.996zm5.821 14.18c-.252.712-1.462 1.306-2.022 1.366-.511.056-1.176.084-3.219-.764-2.613-1.085-4.294-3.744-4.425-3.918-.131-.174-1.063-1.412-1.063-2.695 0-1.283.676-1.914.916-2.165.241-.251.523-.314.697-.314.174 0 .349.002.501.01.159.008.373-.06.584.45.215.52.735 1.79.797 1.921.062.13.104.283.018.456-.088.174-.131.283-.262.436-.131.152-.275.339-.392.47-.131.144-.268.302-.116.563.153.262.68 1.116 1.458 1.81.999.89 1.841 1.166 2.103 1.297.262.131.415.109.568-.066.153-.174.654-.763.83-1.025.174-.262.349-.218.589-.131.24.088 1.526.72 1.788.85.262.131.436.196.491.295.056.1.056.579-.196 1.291z"/></svg>
                    WhatsApp
                </button>

                <button class="btn btn-teams" type="button" data-action="carimbo-teams">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.43 11.23a2.38 2.38 0 1 0-.01-4.76 2.38 2.38 0 0 0 .01 4.76zm-6.27 1.95A1.85 1.85 0 1 0 6.15 9.5a1.85 1.85 0 0 0 .01 3.68zm12.31.23a1.72 1.72 0 1 0-.01-3.44 1.72 1.72 0 0 0 .01 3.44zM13.2 12.5h-1.55c-1.33 0-2.42 1.08-2.42 2.41v1.17c0 .5.4.9.9.9h4.59c.5 0 .9-.4.9-.9v-1.17c0-1.33-1.09-2.41-2.42-2.41zm-7.66.86h-.97a1.85 1.85 0 0 0-1.85 1.85v.85c0 .41.34.75.75.75h3.17c.41 0 .75-.34.75-.75v-.85a1.85 1.85 0 0 0-1.85-1.85zm12.55-.41h-.81a1.67 1.67 0 0 0-1.67 1.67v.78c0 .37.3.67.67.67h3.48c.37 0 .67-.3.67-.67v-.78a1.67 1.67 0 0 0-1.67-1.67z"/></svg>
                    Teams
                </button>
            </footer>

            <footer class="actions-container hidden" id="diarioButtons">
                <button class="btn btn-submit" type="button" data-action="diario-copiar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Gerar e Copiar
                </button>

                <button class="btn btn-word" type="button" data-action="diario-word">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zm3.2 3-1.6 6h-1.5l-1.1-4.1-1.1 4.1H9.4l-1.6-6h1.4l1 4.2 1.1-4.2h1.4l1.1 4.2 1-4.2h1.4z"/></svg>
                    Gerar Word
                </button>

                <button class="btn btn-teams" type="button" data-action="diario-preview">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7zm0 2c-3.7 0-6.8 3-7.8 5 1 2 4.1 5 7.8 5s6.8-3 7.8-5c-1-2-4.1-5-7.8-5zm0 2.2a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6z"/></svg>
                    Pré-visualizar
                </button>
            </footer>
        </section>
    </main>

    <script src="diario-template.js"></script>
    <script src="app.js"></script>
</body>
</html>
